services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_API_URL
        value: /api/v1
      - key: NODE_ENV
        value: production
      - key: DEV_FIXTURES
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
