name: Deploy AI Mystery Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install frontend workspace dependencies
        run: npm ci --workspace client --include-workspace-root=false --include=dev
      - name: Build the React application
        working-directory: client
        run: npm run build
        env:
          VITE_BASE_PATH: /AI-Mystery/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Upload only the built frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
